<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3ea"/>
      <stop offset="1" stop-color="#ffe2cf"/>
    </linearGradient>
    <pattern id="tone2" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF8A3D" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>
  <rect width="1280" height="720" fill="url(#tone2)"/>

  <!-- big problem mark -->
  <text x="120" y="200" font-size="200" font-weight="900" fill="#FF8A3D" opacity="0.18">?</text>

  <!-- panic developer panel (left) -->
  <g transform="translate(120,200)">
    <rect x="0" y="0" width="430" height="380" rx="22" fill="#ffffff" stroke="#2b2b3a" stroke-width="4"/>
    <circle cx="80" cy="80" r="46" fill="#ffd9a8"/>
    <path d="M34,74 Q80,18 126,74 Q112,96 80,96 Q48,96 34,74Z" fill="#3a3a4a"/>
    <g transform="translate(70,150)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#FF8A3D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="0" cy="48" r="8" fill="#FF8A3D"/>
      <line x1="48" y1="0" x2="48" y2="30" stroke="#FF8A3D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="48" cy="48" r="8" fill="#FF8A3D"/>
    </g>
    <text x="160" y="70" font-size="30" font-weight="800" fill="#1b4fb0">线上数据被改了！</text>
    <text x="28" y="250" font-size="22" fill="#444">· 找不到是谁、何时改的</text>
    <text x="28" y="292" font-size="22" fill="#444">· 手写回滚 SQL 又慢又错</text>
    <text x="28" y="334" font-size="22" fill="#444">· binlog 字节流根本读不动</text>
    <rect x="28" y="300" width="374" height="4" fill="#ffe2cf"/>
  </g>

  <!-- guide character pointing (right) -->
  <g transform="translate(820,250)">
    <ellipse cx="0" cy="330" rx="100" ry="20" fill="#000" opacity="0.08"/>
    <circle cx="0" cy="0" r="56" fill="#ffd9a8"/>
    <path d="M-56,-8 Q0,-84 56,-8 Q44,20 0,20 Q-44,20 -56,-8Z" fill="#2D6CDF"/>
    <rect x="-32" y="-64" width="64" height="16" rx="7" fill="#1b4fb0"/>
    <circle cx="-20" cy="4" r="8" fill="#2D6CDF"/>
    <circle cx="20" cy="4" r="8" fill="#2D6CDF"/>
    <path d="M-16,32 Q0,46 16,32" stroke="#a85a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- arm pointing left -->
    <path d="M-44,70 Q-160,90 -300,140" stroke="#2D6CDF" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="-300" cy="140" r="14" fill="#FF8A3D"/>
    <rect x="-44" y="92" width="92" height="130" rx="18" fill="#2D6CDF"/>
    <rect x="-44" y="92" width="92" height="28" rx="18" fill="#1b4fb0"/>
  </g>

  <!-- solution bubble -->
  <g transform="translate(610,540)">
    <rect x="0" y="0" width="560" height="120" rx="20" fill="#ffffff" stroke="#2D6CDF" stroke-width="5"/>
    <path d="M60,118 l-10,42 l40,-22 Z" fill="#ffffff" stroke="#2D6CDF" stroke-width="5"/>
    <text x="28" y="46" font-size="26" font-weight="800" fill="#1b4fb0">别慌！把 binlog 变成「可读的变更清单」，</text>
    <text x="28" y="84" font-size="26" font-weight="800" fill="#FF8A3D">再一键生成回滚 SQL 就行。</text>
  </g>
</svg>
