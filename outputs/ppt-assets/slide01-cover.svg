<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tone" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#000" opacity="0.03"/>
      <circle cx="2" cy="2" r="1" fill="#2D6CDF" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#tone)"/>

  <!-- speed lines radiating from center -->
  <g stroke="#2D6CDF" stroke-width="2" opacity="0.12">
    <line x1="640" y1="320" x2="120" y2="40"/>
    <line x1="640" y1="320" x2="320" y2="20"/>
    <line x1="640" y1="320" x2="640" y2="0"/>
    <line x1="640" y1="320" x2="960" y2="20"/>
    <line x1="640" y1="320" x2="1160" y2="40"/>
    <line x1="640" y1="320" x2="60" y2="360"/>
    <line x1="640" y1="320" x2="1220" y2="360"/>
  </g>

  <!-- floating database / binlog motifs -->
  <g opacity="0.85">
    <g transform="translate(170,470)">
      <ellipse cx="0" cy="0" rx="46" ry="16" fill="#2D6CDF"/>
      <rect x="-46" y="0" width="92" height="60" fill="#2D6CDF"/>
      <ellipse cx="0" cy="60" rx="46" ry="16" fill="#1b4fb0"/>
      <line x1="-46" y1="20" x2="46" y2="20" stroke="#cfe0ff" stroke-width="2"/>
      <line x1="-46" y1="40" x2="46" y2="40" stroke="#cfe0ff" stroke-width="2"/>
    </g>
    <g transform="translate(1080,180)">
      <ellipse cx="0" cy="0" rx="40" ry="14" fill="#FF8A3D"/>
      <rect x="-40" y="0" width="80" height="52" fill="#FF8A3D"/>
      <ellipse cx="0" cy="52" rx="40" ry="14" fill="#d96b1f"/>
      <line x1="-40" y1="18" x2="40" y2="18" stroke="#ffe2c2" stroke-width="2"/>
      <line x1="-40" y1="36" x2="40" y2="36" stroke="#ffe2c2" stroke-width="2"/>
    </g>
  </g>

  <!-- magnifier with binlog stream -->
  <g transform="translate(640,330)">
    <circle cx="0" cy="0" r="120" fill="#ffffff" stroke="#2D6CDF" stroke-width="10"/>
    <circle cx="0" cy="0" r="120" fill="url(#spot)"/>
    <line x1="92" y1="92" x2="180" y2="180" stroke="#1b4fb0" stroke-width="18" stroke-linecap="round"/>
    <text x="0" y="-30" font-size="30" fill="#2D6CDF" text-anchor="middle" font-weight="700">binlog</text>
    <text x="0" y="14" font-size="56" fill="#1b4fb0" text-anchor="middle" font-weight="800">追踪</text>
    <text x="0" y="54" font-size="22" fill="#FF8A3D" text-anchor="middle" font-weight="700">ROW CHANGE</text>
  </g>

  <!-- detective character (guide) bottom-right -->
  <g transform="translate(980,470)">
    <ellipse cx="0" cy="150" rx="90" ry="20" fill="#000" opacity="0.08"/>
    <circle cx="0" cy="0" r="52" fill="#ffd9a8"/>
    <path d="M-52,-6 Q0,-78 52,-6 Q40,18 0,18 Q-40,18 -52,-6Z" fill="#2b2b3a"/>
    <rect x="-30" y="-58" width="60" height="14" rx="6" fill="#2b2b3a"/>
    <circle cx="-18" cy="2" r="7" fill="#2D6CDF"/>
    <circle cx="18" cy="2" r="7" fill="#2D6CDF"/>
    <path d="M-14,28 Q0,40 14,28" stroke="#a85a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="-40" y="58" width="80" height="80" rx="14" fill="#2D6CDF"/>
    <rect x="-40" y="58" width="80" height="22" rx="14" fill="#1b4fb0"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(150,150)">
    <rect x="0" y="0" width="330" height="120" rx="20" fill="#ffffff" stroke="#FF8A3D" stroke-width="5"/>
    <path d="M250,118 l30,40 l-50,-18 Z" fill="#ffffff" stroke="#FF8A3D" stroke-width="5"/>
    <text x="24" y="46" font-size="26" font-weight="800" fill="#1b4fb0">像侦探一样，</text>
    <text x="24" y="84" font-size="26" font-weight="800" fill="#1b4fb0">追踪每一行数据变更！</text>
  </g>

  <!-- title plate -->
  <text x="640" y="660" font-size="30" font-weight="800" fill="#1b4fb0" text-anchor="middle" letter-spacing="2">BinlogTrace · MySQL 数据追踪工具</text>
</svg>
