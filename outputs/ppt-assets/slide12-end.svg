<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#dbe7ff"/>
    </linearGradient>
    <radialGradient id="spot4" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg4)"/>
  <circle cx="640" cy="380" r="320" fill="url(#spot4)"/>

  <!-- confetti -->
  <g opacity="0.9">
    <rect x="220" y="160" width="18" height="18" fill="#FF8A3D" transform="rotate(20 229 169)"/>
    <rect x="1040" y="200" width="16" height="16" fill="#2D6CDF" transform="rotate(-15 1048 208)"/>
    <circle cx="300" cy="500" r="9" fill="#2D6CDF"/>
    <circle cx="980" cy="520" r="9" fill="#FF8A3D"/>
    <rect x="160" y="380" width="14" height="14" fill="#FF8A3D" transform="rotate(35 167 387)"/>
    <rect x="1110" y="360" width="14" height="14" fill="#2D6CDF" transform="rotate(-25 1117 367)"/>
  </g>

  <!-- guide waving -->
  <g transform="translate(640,400)">
    <ellipse cx="0" cy="210" rx="110" ry="22" fill="#000" opacity="0.08"/>
    <circle cx="0" cy="0" r="62" fill="#ffd9a8"/>
    <path d="M-62,-10 Q0,-92 62,-10 Q48,22 0,22 Q-48,22 -62,-10Z" fill="#2D6CDF"/>
    <rect x="-36" y="-70" width="72" height="18" rx="8" fill="#1b4fb0"/>
    <circle cx="-22" cy="4" r="9" fill="#2D6CDF"/>
    <circle cx="22" cy="4" r="9" fill="#2D6CDF"/>
    <path d="M-18,36 Q0,52 18,36" stroke="#a85a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- waving arm -->
    <path d="M46,80 Q120,40 150,-30" stroke="#2D6CDF" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="150" cy="-30" r="14" fill="#ffd9a8"/>
    <rect x="-46" y="104" width="92" height="120" rx="18" fill="#2D6CDF"/>
    <rect x="-46" y="104" width="92" height="26" rx="18" fill="#1b4fb0"/>
  </g>

  <!-- headline -->
  <text x="640" y="120" font-size="56" font-weight="900" fill="#1b4fb0" text-anchor="middle">现在，连接你的数据库试试！</text>
  <text x="640" y="625" font-size="24" fill="#444" text-anchor="middle">连接 → 追踪 → 看变更 → 一键回滚，四步搞定数据追踪</text>
  <text x="640" y="670" font-size="18" fill="#888" text-anchor="middle">⚠ 仅限内网使用 · Agent 默认无认证，请置于防火墙/Nginx 之后</text>
</svg>
