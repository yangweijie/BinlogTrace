<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slide</title>
    <style>
        html {
            background: #ffffff;
        }
        body {
            width: 1440px;
            height: 810px;
            margin: 0;
            padding: 0; /* 不在body上设置padding，避免边距被重复应用 */
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif; /* 使用从原始样式提取的字体，默认 TencentSans */
            display: flex; /* 使用flex防止margin collapse */
            overflow: hidden; /* 防止内容溢出 */
        }
        /* 原始样式，但需要调整：
           1. 移除body样式（由上面的body定义）
           2. 调整slide-page尺寸和边距
        */
        
  
  .slide-page {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    box-sizing: border-box;
    background: #ffffff}
  /* 通用漫画风元素 */
  .panel { background: #eef4ff; border: 4px solid #2D6CDF; border-radius: 18px; }
  .panel-orange { background: #fff3ea; border: 4px solid #FF8A3D; border-radius: 18px; }
  .bubble { background: #ffffff; border: 4px solid #2D6CDF; border-radius: 20px; position: relative; }
  .bubble-orange { background: #ffffff; border: 4px solid #FF8A3D; border-radius: 20px; position: relative; }
  .title { font-size: 44px; font-weight: 800; color: #1b4fb0; }
  .sub { font-size: 22px; color: #444; }
  .h2 { font-size: 34px; font-weight: 800; color: #1b4fb0; }
  .p { font-size: 22px; color: #333; }
  .chip { display: inline-block; background: #2D6CDF; color: #fff; border-radius: 12px; padding: 4px 16px; font-size: 20px; font-weight: 700; }
  .chip-o { display: inline-block; background: #FF8A3D; color: #fff; border-radius: 12px; padding: 4px 16px; font-size: 20px; font-weight: 700; }
  .stepnum { position: absolute; top: -28px; left: -14px; width: 64px; height: 64px; background: #FF8A3D; color:#fff; border-radius: 50%; font-size: 34px; font-weight: 800; text-align:center; line-height: 64px; border: 4px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2);}
  .foot { position: absolute; bottom: 26px; left: 60px; font-size: 16px; color: #999; }
  .tag { position: absolute; top: 40px; right: 60px; font-size: 18px; color: #2D6CDF; font-weight: 700; }

        /* 确保slide-page div适应body，并设置margin来实现边距 */
        /* 重要：使用margin而不是padding，避免被html2pptx_official.js转换为margin导致边距放大 */
        /* html2pptx_official.js会将元素的padding转换为margin，但margin会直接使用，不会重复应用 */
        /* slide-page的尺寸需要减去margin，避免超出body */
        .slide-page {
            width: calc(100% - 0 - 0) !important;
            height: calc(100% - 0 - 0) !important;
            box-sizing: border-box !important;
            margin: 0 0 0 0 !important; /* 使用margin实现边距，避免重复应用 */
        }
        /* 对于没有特殊display属性的slide-page，使用block布局 */
        .slide-page:not(.cover):not([style*="display"]) {
            display: block !important;
        }
    </style>
</head>
<body>
<div class="slide-page" style="background:#ffffff; padding:50px 60px;">
  <div class="title"><p>灵活独立回滚：任意勾选，不止于整笔</p></div>
  <div style="display:flex; gap:36px; margin-top:30px; align-items:flex-start;">
    <div style="flex:1.1;">
      <img src="file://D:/git/php/typephp_dms/outputs/slides/08-independent-rollback.png" style="width:100%; border:4px solid #FF8A3D; border-radius:14px;">
    </div>
    <div style="flex:1;">
      <div class="panel" style="padding:30px;">
        <div class="h2" style="margin-bottom:14px;"><p>为什么需要独立回滚</p></div>
        <ul style="font-size:23px; line-height:2; color:#333; padding-left:26px; margin:0;">
          <li>跨事务挑选若干条变更</li>
          <li>无需回滚整笔，只还原需要的部分</li>
          <li>每条独立生成对应回滚 SQL</li>
          <li>精细控制，避免误伤正常数据</li>
        </ul>
      </div>
    </div>
  </div>
  <div class="foot"><p>页面路径：/rollback 回滚页</p></div>
</div>
</body>
</html>
