; binlog-agent 运行时配置 — 与二进制同目录分发
; embed SAPI 会在二进制所在目录找到本文件并加载扩展
; 说明：bcmath 已静态内建；pdo_mysql / sockets 为动态扩展（打包时随 ext/ 分发）
; 开发期 extension_dir 指向 tpc 发行版 ext/；打包时由 package.bat 重写为本包 ext/ 绝对路径
extension_dir = "D:/git/php/tpc_v0.9.5_windows_x64/ext"
extension=php_pdo_mysql.dll
extension=php_sockets.dll
enable_dl = On

; 抗 ASLR：embed SAPI 的 OPcache 句柄表在 Windows ASLR 下偶发 "Opcode handlers are
; unusable due to ASLR" 启动 fatal（dump 子进程自拉起时命中会导致 worker 静默死掉、
; 前端只见心跳 0 变更）。改用文件缓存 + fallback 规避（目录须存在且可写）。
opcache.enable=1
opcache.file_cache="D:/git/php/typephp_dms/opcache_cache"
opcache.file_cache_fallback=1
