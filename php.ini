; binlog-agent macOS 运行时配置（放在二进制同目录）
; Windows 版见 php.ini.windows（package.bat 组包时会自行生成 php.ini）
;
; macOS 构建把 pdo / pdo_mysql / sockets / bcmath / filter / mbstring / ctype
; 静态编入私有 embed 运行时（见 project.macos.yml），无需 extension= 行。
; 不要在这里写 Windows 的 .dll 或 D: 路径：embed SAPI 会读本文件，
; 无效扩展项会在启动时产生警告。

; 顺序扫描历史 binlog（窗口起点自动定位到文件头 pos=4）会解析大量历史行事件，
; 默认 128M 会在 krowinski 的 RowEvent 解析中耗尽 → fatal → 子进程退出 255。
memory_limit = 1G
